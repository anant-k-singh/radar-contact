<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Radar Contact">
  <title>Radar Contact</title>
  <!--
    The favicon-sized cut. At 16-32 px the range rings turn to mush and two
    blips cannot be told apart, so this keeps only what survives: the ground,
    one ring, the sweep, one aircraft, and the centerline it is being turned
    onto. Same palette as icon.svg, so the two read as one mark.
  -->
  <defs>
    <linearGradient id="sweepS" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#74e874" stop-opacity="0"/>
      <stop offset="1" stop-color="#74e874" stop-opacity="0.34"/>
    </linearGradient>
    <clipPath id="scopeS"><circle cx="256" cy="256" r="200"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="108" fill="#04070a"/>
  <circle cx="256" cy="256" r="200" fill="#071310"/>

  <g clip-path="url(#scopeS)">
    <circle cx="256" cy="256" r="200" fill="none" stroke="#1d5c3d" stroke-width="16"/>
    <path d="M256 256L456 256A200 200 0 0 0 197 62Z" fill="url(#sweepS)"/>
    <path d="M256 256L385 103" stroke="#74e874" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- One aircraft, inbound, with its leader line ahead of it. -->
  <path d="M348 156L348 232" stroke="#a6c8ea" stroke-width="22" stroke-linecap="round"/>
  <circle cx="348" cy="146" r="38" fill="#cfdae6"/>

  <!-- Final approach track, with the runway at its foot. -->
  <path d="M256 268V386" stroke="#3f86e8" stroke-width="24" stroke-linecap="round"/>
  <path d="M256 392V442" stroke="#d8e4dc" stroke-width="34" stroke-linecap="butt"/>
</svg>
