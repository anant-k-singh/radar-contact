<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Radar Contact">
  <title>Radar Contact</title>
  <defs>
    <!-- The sweep trailing behind the leading edge, brightest where it just passed. -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#74e874" stop-opacity="0"/>
      <stop offset="1" stop-color="#74e874" stop-opacity="0.30"/>
    </linearGradient>
    <clipPath id="scope"><circle cx="256" cy="256" r="196"/></clipPath>
  </defs>

  <!-- The scope's own ground, squared off so the icon fills its tile. -->
  <rect width="512" height="512" rx="108" fill="#04070a"/>
  <circle cx="256" cy="256" r="196" fill="#071310"/>

  <g clip-path="url(#scope)">
    <!-- Range rings and the cardinal cross, dimmer than the traffic over them. -->
    <g fill="none" stroke="#1d5c3d" stroke-width="7">
      <circle cx="256" cy="256" r="196"/>
    </g>
    <g fill="none" stroke="#123726" stroke-width="5">
      <circle cx="256" cy="256" r="131"/>
      <circle cx="256" cy="256" r="66"/>
    </g>
    <g stroke="#123726" stroke-width="5">
      <path d="M256 60V452M60 256H452"/>
    </g>

    <!-- The sweep, one arc short of the blip so the blip reads as freshly painted. -->
    <path d="M256 256L452 256A196 196 0 0 0 394 117Z" fill="url(#sweep)"/>
    <path d="M256 256L394 117" stroke="#74e874" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Two aircraft being turned onto final, each with its leader line ahead of
       it: the sequencing that the whole game is. Set off the sweep's edge so
       the blip and the sweep do not read as one line. -->
  <g stroke="#a6c8ea" stroke-width="13" stroke-linecap="round">
    <path d="M356 168L356 231"/>
    <path d="M136 226L189 258"/>
  </g>
  <circle cx="356" cy="152" r="22" fill="#cfdae6"/>
  <circle cx="121" cy="217" r="18" fill="#cfdae6"/>

  <!-- Established on final: the centerline the traffic is funnelled onto, with
       the runway at its foot. -->
  <g stroke="#3f86e8" stroke-width="11" stroke-linecap="round">
    <path d="M256 262V392"/>
  </g>
  <g stroke="#d8e4dc" stroke-width="19" stroke-linecap="butt">
    <path d="M256 392V440"/>
  </g>
</svg>
